# One description, three package formats: nfpm (https://nfpm.goreleaser.com)
# turns this into a .deb, an .rpm and an Arch package from the same file
# tree, so a Fedora or Arch user gets the same install as a Debian one. The
# Linux counterpart of windows/installer/Anoya.iss.
#
# What a package has to do here that `flutter build linux` cannot: put the
# tunnel service next to the app, register it with systemd (it runs as root —
# creating the device is the privileged act, and the app never has that
# privilege), and hand the engine's directory to the user, who downloads the
# geo databases into it while the service reads them.
#
# Driven by scripts/build-linux-packages.sh, which sets VERSION and ARCH from
# pubspec and the target, and stages the Flutter bundle at the fixed path
# below (nfpm expands variables in fields, not in file paths).
name: anoya
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: org.anoya <noreply@anoya.org>
description: |
  Anoya VPN client.
  A VPN client with a system-wide tunnel. The tunnel is hosted by the
  anoya-tunnel service, which this package registers with systemd.
homepage: https://github.com/anoya/anoya-client
license: Proprietary

contents:
  - src: build/linux/stage/bundle
    dst: /opt/anoya
    type: tree
  - src: build/linux/service/tunnel-service
    dst: /opt/anoya/service/tunnel-service
    file_info:
      mode: 0755
  - src: linux/packaging/anoya-tunnel.service
    dst: /usr/lib/systemd/system/anoya-tunnel.service
  - src: linux/packaging/org.anoya.desktop
    dst: /usr/share/applications/org.anoya.desktop
  - src: linux/packaging/anoya.png
    dst: /usr/share/icons/hicolor/256x256/apps/anoya.png
  - src: /opt/anoya/anoya
    dst: /usr/bin/anoya
    type: symlink

scripts:
  postinstall: linux/packaging/scripts/postinstall.sh
  preremove: linux/packaging/scripts/preremove.sh
  postremove: linux/packaging/scripts/postremove.sh

# The GTK the runner links and the libsecret the secure-storage plugin
# links, under each distribution's names for them. libsecret talks to a
# Secret Service (GNOME Keyring, KWallet); which one is the desktop's choice,
# so none is depended on.
overrides:
  deb:
    depends: [libgtk-3-0, libsecret-1-0, systemd]
  rpm:
    depends: [gtk3, libsecret, systemd]
  archlinux:
    depends: [gtk3, libsecret, systemd]
