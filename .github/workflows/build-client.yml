# Builds the client for the three platforms that can be built on hosted
# runners: an Android APK, a Windows installer and a Linux .deb. Apple needs
# signing identities and a paid team, so those builds stay on a Mac for now.
#
# Amnezia support needs credentials that are not in the repository. Set them as
# four repository secrets — AGW_ENDPOINT, AGW_PUBLIC_KEY_B64, AGW_S3_ENDPOINTS
# and AGW_S3_FALLBACK_ENDPOINTS — and every build passes each one it finds as
# its own --dart-define. A secret left unset is simply not passed, so the code's own
# default stands; without the key material the builds still run, and Amnezia
# keys are refused with a message rather than failing (see README.md).
name: build-client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  # The Dart tests run on the host, not on a target, so they run once here
  # rather than inside each build. In parallel with the builds on purpose: a
  # red test is visible in the status, and the artifacts still get built.
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      # The formatter is part of the language, not a preference: a diff that is
      # only whitespace is noise in every review that follows it. The one
      # project-wide reformat is in .git-blame-ignore-revs.
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Amnezia gateway SDK is a submodule; without it build-so.sh
          # refuses to run.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/mihomocore/go.mod
          cache-dependency-path: |
            native/mihomocore/go.sum
            native/libagw/upstream/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # gomobile finds the NDK through ANDROID_NDK_HOME; the runner exposes the
      # one it ships as ANDROID_NDK_LATEST_HOME (a machine variable, so it is
      # read in the shell, not through the env context). build-so.sh scans
      # $ANDROID_HOME/ndk on its own.
      - name: Engine AAR and gateway library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          native/mihomocore/build-aar.sh
          native/libagw/build-so.sh

      - name: Build APK
        env:
          AGW_ENDPOINT: ${{ secrets.AGW_ENDPOINT }}
          AGW_PUBLIC_KEY_B64: ${{ secrets.AGW_PUBLIC_KEY_B64 }}
          AGW_S3_ENDPOINTS: ${{ secrets.AGW_S3_ENDPOINTS }}
          AGW_S3_FALLBACK_ENDPOINTS: ${{ secrets.AGW_S3_FALLBACK_ENDPOINTS }}
        run: |
          # One --dart-define per secret that is set. Passing an empty one
          # would override the code's default with nothing.
          args=()
          for name in AGW_ENDPOINT AGW_PUBLIC_KEY_B64 \
                      AGW_S3_ENDPOINTS AGW_S3_FALLBACK_ENDPOINTS; do
            value="${!name}"
            if [ -n "$value" ]; then args+=(--dart-define="$name=$value"); fi
          done
          flutter pub get
          scripts/build-android.sh "${args[@]+"${args[@]}"}"

      - name: Artifact names
        id: meta
        run: |
          label="$(sed -n 's/.*android:label="\([^"]*\)".*/\1/p' \
                   android/app/src/main/AndroidManifest.xml | head -1)"
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          echo "prefix=$label-$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.prefix }}-android-arm64-v8a
          path: build/app/outputs/flutter-apk/*-arm64-v8a.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.prefix }}-android-x86_64
          path: build/app/outputs/flutter-apk/*-x86_64.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/mihomocore/go.mod
          cache-dependency-path: |
            native/mihomocore/go.sum
            native/libagw/upstream/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The service is pure Go and the Wintun driver is a pinned download; the
      # script does both and verifies the driver's checksum.
      - name: Tunnel service and Wintun
        run: scripts/build-tunnel-service.sh

      # The gateway library is cgo, so it needs a C compiler; the runner image
      # ships MinGW-w64. It has to exist before the app is built — CMake copies
      # it into the bundle during that build.
      - name: Gateway library
        run: native/libagw/build-dll.sh

      - name: Build app
        env:
          AGW_ENDPOINT: ${{ secrets.AGW_ENDPOINT }}
          AGW_PUBLIC_KEY_B64: ${{ secrets.AGW_PUBLIC_KEY_B64 }}
          AGW_S3_ENDPOINTS: ${{ secrets.AGW_S3_ENDPOINTS }}
          AGW_S3_FALLBACK_ENDPOINTS: ${{ secrets.AGW_S3_FALLBACK_ENDPOINTS }}
        run: |
          # One --dart-define per secret that is set. Passing an empty one
          # would override the code's default with nothing.
          args=()
          for name in AGW_ENDPOINT AGW_PUBLIC_KEY_B64 \
                      AGW_S3_ENDPOINTS AGW_S3_FALLBACK_ENDPOINTS; do
            value="${!name}"
            if [ -n "$value" ]; then args+=(--dart-define="$name=$value"); fi
          done
          flutter pub get
          flutter build windows --release "${args[@]+"${args[@]}"}"

      # Inno Setup is not on PATH even where the image ships it; the version
      # comes from pubspec, the one place it is written.
      - name: Installer
        run: |
          version="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup -y --no-progress
          # Git Bash rewrites arguments that start with a slash into Windows
          # paths, so "/DAppVersion=…" reached ISCC as a second script file.
          MSYS_NO_PATHCONV=1 "$iscc" "windows\\installer\\AnnoyaTest.iss" "/DAppVersion=$version"

      - name: Artifact names
        id: meta
        run: |
          name="$(sed -n 's/^set(BINARY_NAME "\([^"]*\)").*/\1/p' \
                  windows/CMakeLists.txt | head -1)"
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          echo "prefix=$name-$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.prefix }}-windows-x64-installer
          path: build/windows/installer/*.exe
          if-no-files-found: error

      # The bare build too, for a machine where the installer cannot run: the
      # app folder plus the service and driver it expects next to it.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.prefix }}-windows-x64-portable
          path: |
            build/windows/x64/runner/Release/
            build/windows/service/
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/mihomocore/go.mod
          cache-dependency-path: |
            native/mihomocore/go.sum
            native/libagw/upstream/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # What `flutter build linux` needs from the distribution: the GTK
      # toolkit the runner links, and a C++ toolchain.
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # Pure Go, as on Windows; no driver to fetch, the device is the kernel's.
      - name: Tunnel service
        run: scripts/build-tunnel-service.sh linux

      # The gateway library is cgo and builds natively here. It has to exist
      # before the app is built — CMake copies it into the bundle then.
      - name: Gateway library
        run: native/libagw/build-linux.sh

      - name: Build app
        env:
          AGW_ENDPOINT: ${{ secrets.AGW_ENDPOINT }}
          AGW_PUBLIC_KEY_B64: ${{ secrets.AGW_PUBLIC_KEY_B64 }}
          AGW_S3_ENDPOINTS: ${{ secrets.AGW_S3_ENDPOINTS }}
          AGW_S3_FALLBACK_ENDPOINTS: ${{ secrets.AGW_S3_FALLBACK_ENDPOINTS }}
        run: |
          # One --dart-define per secret that is set. Passing an empty one
          # would override the code's default with nothing.
          args=()
          for name in AGW_ENDPOINT AGW_PUBLIC_KEY_B64 \
                      AGW_S3_ENDPOINTS AGW_S3_FALLBACK_ENDPOINTS; do
            value="${!name}"
            if [ -n "$value" ]; then args+=(--dart-define="$name=$value"); fi
          done
          flutter pub get
          flutter build linux --release "${args[@]+"${args[@]}"}"

      # The .deb registers the systemd unit and creates the engine directory;
      # the version comes from pubspec, the one place it is written.
      - name: Package
        run: scripts/build-linux-deb.sh amd64

      - name: Artifact names
        id: meta
        run: |
          name="$(sed -n 's/^set(BINARY_NAME "\([^"]*\)").*/\1/p' \
                  linux/CMakeLists.txt | head -1)"
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          echo "prefix=$name-$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.prefix }}-linux-x64-deb
          path: build/linux/deb/*.deb
          if-no-files-found: error

      # The bare build too, for a distribution without dpkg: the app bundle
      # plus the service and the unit it expects.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.prefix }}-linux-x64-portable
          path: |
            build/linux/x64/release/bundle/
            build/linux/service/
            linux/packaging/annoyatest-tunnel.service
          if-no-files-found: error
